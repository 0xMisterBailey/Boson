<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>feedback-engine</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Martian+Mono:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1714; --ink2:#2a2420; --paper:#f4ecdc; --paper2:#e9dcc3; --text:#231d18; --mute:#7c6f60;
  --yep:#b6f23a; --nope:#ff5a3c; --gold:#ffc53d; --skip:#9aa3ff; --glow:0 0 18px;
  --display:'Bungee',Impact,sans-serif; --mono:'Martian Mono',ui-monospace,monospace; --read:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden;
  font-family:var(--read);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(1200px 600px at 15% -10%,rgba(255,90,60,.16),transparent 60%),
   radial-gradient(900px 500px at 110% 110%,rgba(182,242,58,.12),transparent 60%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:980px;margin:0 auto;padding:14px 16px calc(12px + env(safe-area-inset-bottom))}

/* ---------- HUD ---------- */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.lvl{font-family:var(--display);font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.lvl b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:18px;box-shadow:var(--glow) rgba(255,197,61,.45)}
.bars{display:grid;gap:7px}
.xp{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffe08a);transition:width .45s cubic-bezier(.2,.9,.3,1.3)}
.pips{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.pips span{height:6px;border-radius:2px;background:rgba(255,255,255,.1);transition:background .2s,transform .2s}
.pips span.y{background:var(--yep)} .pips span.n{background:var(--nope)} .pips span.s{background:var(--skip)} .pips span.g{background:var(--gold);transform:scaleY(1.6)}
.stats{display:flex;gap:16px;font-family:var(--mono);font-size:12px;color:#cdbfa8;white-space:nowrap}
.stats .k{display:block;font-size:9px;letter-spacing:.14em;color:#8d8171;text-transform:uppercase}
.stats .v{font-weight:700;font-size:15px;color:var(--paper)}
.flame.hot .v{color:var(--gold);text-shadow:0 0 12px rgba(255,197,61,.7)}

/* ---------- stage ---------- */
.stage{position:relative;display:grid;place-items:center;min-height:0;padding:16px 0}
.card{position:relative;width:100%;max-height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--text);
  border-radius:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06) inset;overflow:hidden;
  touch-action:pan-y;user-select:none;will-change:transform;animation:rise .32s cubic-bezier(.2,.9,.3,1.15)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;opacity:0;transition:opacity .08s}
.card.tint-y::after{background:rgba(182,242,58,.28);opacity:1} .card.tint-n::after{background:rgba(255,90,60,.24);opacity:1}
@keyframes rise{from{transform:translateY(26px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.card.fly-y{transition:transform .34s cubic-bezier(.5,0,.9,.4),opacity .34s;transform:translateX(120%) rotate(14deg)!important;opacity:0}
.card.fly-n{transition:transform .34s cubic-bezier(.5,0,.9,.4),opacity .34s;transform:translateX(-120%) rotate(-14deg)!important;opacity:0}
.card.fly-s{transition:transform .3s,opacity .3s;transform:translateY(60%) scale(.9)!important;opacity:0}
.src{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--paper2);font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.02em}
.src .gold-tag{display:none;color:#8a5a00;font-weight:700}
.claim{padding:20px 22px 18px;border-bottom:2px dashed #d8c8a8}
.claim .lab,.passage .lab{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--nope);margin-bottom:8px}
.claim .ctx{font-size:14px;line-height:1.45;color:var(--mute);font-style:italic;margin-bottom:8px}
.claim p{font-size:clamp(19px,2.6vw,25px);line-height:1.32;font-weight:600;letter-spacing:-.005em}
.card>*{flex:0 0 auto}
.passage{padding:16px 22px 22px;overflow:auto;min-height:0;flex:1 1 auto!important}
.shot{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:10px 12px;background:#f3ead6}
.shot img{max-width:100%;max-height:100%;object-fit:contain;border:2px solid #d8c8a8;border-radius:6px}
/* image cards: the card takes the stage's full height and the image is fitted inside its own box,
   so a tall image (portrait poster) is never cropped and never covers the text panes */
.card:has(.shot){height:100%}
.shot{position:relative;overflow:hidden;flex:3 1 0!important}
.shot img{position:absolute;inset:10px 12px;width:calc(100% - 24px);height:calc(100% - 20px);max-width:none;max-height:none;border:0}
.card:has(.shot) .passage{flex:1 1 0!important}
.passage .lab{color:#5b8a00}
/* pair cards: two raw-HTML panes, ← picks left, → picks right */
.pair{flex:1 1 auto!important;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;background:#f3ead6;min-height:0;overflow:auto}
.pair figure{margin:0;display:grid;grid-template-rows:auto 1fr;gap:6px;min-width:0}
.pair figcaption{font-family:var(--mono);font-size:12px;color:var(--mute)}
.pair figcaption b{color:var(--text)}
.pair .raw{background:#0d100b;color:#ece4cc;border-radius:8px;padding:12px;font:clamp(7px,1.35vw,13.5px)/1.18 ui-monospace,'DejaVu Sans Mono',monospace;white-space:pre;overflow-x:auto}
@media (max-width:640px){.pair{grid-template-columns:1fr}}
.passage p{font-size:clamp(15.5px,1.9vw,17.5px);line-height:1.62;color:#3a3029;white-space:pre-wrap}
.rows{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;padding:12px 22px;margin:0;border-bottom:2px dashed #d8c8a8;font-size:14.5px;line-height:1.45;color:#3a3029}
.rows dt{font-family:var(--display);font-size:10.5px;letter-spacing:.12em;color:var(--mute);padding-top:3px}
.rows dd{margin:0}
.md{font-size:clamp(14.5px,1.7vw,16px);line-height:1.58;color:#3a3029}
.md p{margin:0 0 .7em;white-space:normal;font-size:inherit;line-height:inherit}
.md h3,.md h4,.md h5,.md h6{font-family:var(--display);font-size:12px;letter-spacing:.1em;margin:1em 0 .4em;color:var(--mute)}
.md ul,.md ol{margin:0 0 .7em;padding-left:1.3em}.md li{margin:.15em 0}
.md blockquote{margin:0 0 .7em;padding:.3em .8em;border-left:3px solid #d8c8a8;color:var(--mute);font-style:italic}
.md code,.data{font-family:var(--mono);font-size:.88em;background:var(--paper2);border-radius:3px;padding:0 .25em}
.data{display:block;padding:10px;white-space:pre-wrap;overflow:auto;font-size:13px}
.md table{border-collapse:collapse;margin:0 0 .8em;font-size:.9em;width:100%}
.md th,.md td{border:1px solid #e2d6bd;padding:4px 7px;text-align:left;vertical-align:top}
.md th{background:var(--paper2)}
.md a{color:#2d5f9a}.wl{color:#7a4b9a;border-bottom:1px dotted #7a4b9a}
mark{background:none;color:inherit;font-weight:700;padding:0 .08em;border-radius:3px;box-shadow:inset 0 -.42em 0 rgba(255,197,61,.45)}
.stamp{position:absolute;top:26%;font-family:var(--display);font-size:54px;padding:4px 16px;border:5px solid;border-radius:12px;opacity:0;pointer-events:none;transform:rotate(-12deg)}
.stamp.y{right:8%;color:#5b8a00;border-color:#5b8a00} .stamp.n{left:8%;color:#d23b1f;border-color:#d23b1f;transform:rotate(12deg)}

/* ---------- controls ---------- */
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.btn{font-family:var(--display);font-size:clamp(18px,3vw,26px);letter-spacing:.04em;border:0;border-radius:16px;padding:16px 10px;cursor:pointer;color:var(--ink);
  transition:transform .08s,box-shadow .15s;display:flex;justify-content:center;align-items:center;gap:12px}
.btn small{font-family:var(--mono);font-size:11px;opacity:.6;letter-spacing:0}
.btn:active,.btn.press{transform:translateY(3px) scale(.98)}
.nope{background:var(--nope);box-shadow:0 6px 0 #a8301b,0 0 30px rgba(255,90,60,.25)}
.yep{background:var(--yep);box-shadow:0 6px 0 #6c9a12,0 0 30px rgba(182,242,58,.22)}
.mid{display:grid;gap:8px}
.mini{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.07);color:#d9ccb6;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;cursor:pointer}
.why{grid-column:1/-1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:30px;font-family:var(--mono);font-size:11px;color:#8d8171;opacity:0;transition:opacity .2s}
.why.on{opacity:1}
.why button{font:inherit;background:transparent;color:#d9ccb6;border:1px dashed rgba(255,255,255,.22);border-radius:99px;padding:5px 11px;cursor:pointer}
.why button.lit{background:var(--nope);color:var(--ink);border-color:var(--nope)}

/* ---------- toasts, overlays ---------- */
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);font-family:var(--display);pointer-events:none;z-index:5;text-align:center;
  font-size:30px;animation:pop 1.1s ease-out forwards;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.toast.gold{font-size:52px;color:var(--gold);text-shadow:0 0 30px rgba(255,197,61,.8),0 5px 0 #7a4d00}
.toast.miss{font-family:var(--mono);font-size:15px;color:var(--paper);background:#3a2a22;border:1px solid var(--gold);padding:12px 16px;border-radius:12px;animation:pop 2.6s ease-out forwards;max-width:86vw}
.toast.xp{font-size:22px;color:var(--yep)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,14px) scale(.7)}14%{opacity:1;transform:translate(-50%,0) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.overlay{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:rgba(15,12,10,.86);backdrop-filter:blur(6px)}
.overlay.on{display:grid}
.panel{width:min(560px,92vw);background:var(--ink2);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:28px 28px 24px;text-align:center;animation:rise .35s}
.panel h2{font-family:var(--display);font-size:34px;color:var(--gold);margin-bottom:6px}
.panel .sub{font-family:var(--mono);font-size:12px;color:#a89a86;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.grid3 div{background:rgba(255,255,255,.04);border-radius:14px;padding:14px 8px}
.grid3 .v{font-family:var(--display);font-size:26px;color:var(--paper)} .grid3 .k{font-family:var(--mono);font-size:10px;color:#8d8171;letter-spacing:.12em;text-transform:uppercase}
.go{font-family:var(--display);font-size:20px;background:var(--yep);color:var(--ink);border:0;border-radius:14px;padding:14px 30px;cursor:pointer;box-shadow:0 5px 0 #6c9a12}
.note-in{width:100%;background:var(--ink);color:var(--paper);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.5;resize:vertical;margin-bottom:16px}
.note-in:focus{outline:2px solid var(--gold);outline-offset:1px}
.note-row{display:flex;gap:10px;justify-content:center;align-items:center}
.has-note{color:var(--gold)}
.keys{font-family:var(--mono);font-size:12px;color:#cdbfa8;text-align:left;line-height:2;margin:10px 0 20px}
.keys kbd{font-family:var(--mono);background:rgba(255,255,255,.1);border-radius:6px;padding:2px 7px;margin-right:6px;color:var(--paper)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:7}
@media (max-width:640px){.hud{grid-template-columns:auto 1fr}.stats{grid-column:1/-1;justify-content:space-between}.btn small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="lvl"><b id="lvl">1</b><span>LVL</span></div>
    <div class="bars"><div class="xp"><i id="xp"></i></div><div class="pips" id="pips"></div></div>
    <div class="stats">
      <div><span class="k">done</span><span class="v" id="done">0</span><span id="total" style="color:#8d8171"></span></div>
      <div class="flame" id="flameBox"><span class="k">streak</span><span class="v" id="streak">0</span></div>
      <div><span class="k">gold</span><span class="v" id="gold">—</span></div>
      <div><span class="k">left</span><span class="v" id="eta">—</span></div>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="ctrl">
    <button class="btn nope" id="bN"><span id="noLab">NOPE</span> <small>← F</small></button>
    <div class="mid">
      <button class="mini" id="bS" title="unsure">unsure ↓</button>
      <button class="mini" id="bU" title="undo">undo Z</button>
      <button class="mini" id="bT" title="note">note T</button>
    </div>
    <button class="btn yep" id="bY"><small>J →</small> <span id="yesLab">YEP</span></button>
    <div class="why" id="why"></div>
  </footer>
</div>

<div class="overlay on" id="intro"><div class="panel">
  <h2 id="introTitle">FEEDBACK</h2>
  <div class="sub" id="introQ"></div>
  <div class="keys">
    <div><kbd>→</kbd><kbd>J</kbd> <span id="kYes"></span></div>
    <div><kbd>←</kbd><kbd>F</kbd> <span id="kNo"></span></div>
    <div><kbd>↓</kbd><kbd>space</kbd> unsure: skip it, no penalty</div>
    <div><kbd>Z</kbd> undo · <kbd>T</kbd> write a note<span id="kTags"></span> · <kbd>M</kbd> sound</div>
    <div style="color:#8d8171" id="kFoot"></div>
  </div>
  <button class="go" id="start">START ▸</button>
</div></div>

<div class="overlay" id="brk"><div class="panel">
  <h2 id="brkTitle">ROUND CLEAR</h2>
  <div class="sub" id="brkSub"></div>
  <div class="grid3">
    <div><div class="v" id="bPace">—</div><div class="k">sec / card</div></div>

    <div><div class="v" id="bGold">—</div><div class="k">gold hits</div></div>
    <div><div class="v" id="bLeft">—</div><div class="k">min left</div></div>
  </div>
  <button class="go" id="cont">NEXT ROUND ▸</button>
  <div class="sub" style="margin:14px 0 0">stretch · water · Enter to continue</div>
</div></div>

<div class="overlay" id="noteBox"><div class="panel">
  <h2>NOTE</h2>
  <div class="sub" id="noteFor"></div>
  <textarea class="note-in" id="noteText" rows="4" placeholder="what the card cannot capture..."></textarea>
  <div class="note-row">
    <button class="go" id="noteSave">SAVE ▸</button>
    <button class="mini" id="noteCancel">cancel esc</button>
  </div>
</div></div>
<canvas id="fx"></canvas>

<script>
const $ = s => document.querySelector(s);
let CFG = {}, TAGS = [], ROUND = 20;
const XP_CARD = 10, XP_GOLD = 40, XP_LVL = 200;
let queue = [], done = {}, order = [], cur = null, shownAt = 0, streak = 0, lastNope = null, history = [];
let round = [], roundStart = Date.now(), roundGold = [0, 0], sound = true, busy = false, started = false;

// ---------- audio: tiny synth blips ----------
let ac;
function blip(f1, f2, dur = .09, type = "square", vol = .05) {
  if (!sound) return;
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  y: () => blip(520, 880, .08), n: () => blip(300, 170, .09, "sawtooth", .035), s: () => blip(400, 380, .05, "sine"),
  gold: () => [0, 90, 180].forEach((d, i) => setTimeout(() => blip([660, 880, 1320][i], [700, 940, 1400][i], .12, "triangle", .06), d)),
  lvl: () => [0, 80, 160, 240].forEach((d, i) => setTimeout(() => blip(440 * (1 + i * .25), 460 * (1 + i * .25), .1, "triangle", .06), d)),
};

// ---------- confetti ----------
const cv = $("#fx"), cx = cv.getContext("2d"); let parts = [];
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
function confetti(n = 90, x = innerWidth / 2, y = innerHeight * .35) {
  const cols = ["#ffc53d", "#b6f23a", "#ff5a3c", "#f4ecdc", "#9aa3ff"];
  for (let i = 0; i < n; i++) parts.push({x, y, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 3, r: Math.random() * 6 + 3,
    c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - .5) * .4, life: 1});
  if (parts.length === n) requestAnimationFrame(tick);
}
function tick() {
  const d = devicePixelRatio; cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += .42; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life -= .011;
    cx.save(); cx.globalAlpha = Math.max(p.life, 0); cx.translate(p.x * d, p.y * d); cx.rotate(p.a);
    cx.fillStyle = p.c; cx.fillRect(-p.r * d / 2, -p.r * d / 4, p.r * d, p.r * d / 2); cx.restore();
  }
  if (parts.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
}
function toast(html, cls = "", ms = 1100) {
  const t = document.createElement("div"); t.className = "toast " + cls; t.innerHTML = html;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms + 1600);
}

// ---------- data ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const hl = s => !CFG.highlight_numbers ? esc(s) : esc(s).replace(/([$€£]?[A-Za-z]*\d[\w.,:%/×x-]*)/g, (m) => { const t = m.replace(/[.,:]+$/, ""); return `<mark>${t}</mark>${m.slice(t.length)}`; });
const labelled = () => Object.values(done).filter(r => r.label !== undefined);
// ---- data formats: config.formats = {slot: "text"|"markdown"|"json"|"code"} ----
function inlineMd(t) {                  // t is already HTML-escaped
  return t.replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, alias) => {
      const label = alias || target;
      return CFG.wikilink_url ? `<a class="wl" target="_blank" href="${CFG.wikilink_url.replace("{}", encodeURIComponent(target))}">${label}</a>`
                              : `<span class="wl">${label}</span>`; })
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a target="_blank" rel="noopener" href="$2">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a target="_blank" rel="noopener" href="$2">$2</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<i>$2</i>");
}
function md(src) {                      // small, safe markdown: escape first, then structure
  const lines = esc(String(src)).split("\n"), out = []; let list = null, para = [], table = null;
  const flushP = () => { if (para.length) { out.push(`<p>${inlineMd(para.join(" "))}</p>`); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map(i => `<li>${inlineMd(i)}</li>`).join("")}</${list.t}>`); list = null; } };
  const flushT = () => { if (table) { const [h, ...b] = table; out.push(`<table><thead><tr>${h.map(c => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead><tbody>${b.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`); table = null; } };
  const flush = () => { flushP(); flushL(); flushT(); };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if (/^\s*\|.*\|\s*$/.test(l)) { flushP(); flushL(); if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue;
      (table = table || []).push(l.trim().slice(1, -1).split("|").map(c => c.trim())); continue; }
    flushT();
    if (!l.trim()) { flushP(); flushL(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); out.push(`<h${m[1].length + 2}>${inlineMd(m[2])}</h${m[1].length + 2}>`); continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)/)) || (m = l.match(/^\s*\d+[.)]\s+(.*)/))) {
      const t = /^\s*\d/.test(l) ? "ol" : "ul"; flushP(); if (list && list.t !== t) flushL();
      (list = list || {t, items: []}).items.push(m[1]); continue; }
    if ((m = l.match(/^&gt;\s?(.*)/))) { flush(); out.push(`<blockquote>${inlineMd(m[1])}</blockquote>`); continue; }
    if (list && /^\s{2,}\S/.test(raw)) { list.items[list.items.length - 1] += " " + l.trim(); continue; }
    flushL(); para.push(l.trim());
  }
  flush(); return `<div class="md">${out.join("")}</div>`;
}
function fmt(slot, v) {
  const f = (CFG.formats || {})[slot] || "text";
  if (f === "markdown") return md(v);
  if (f === "json") return `<pre class="data">${esc(typeof v === "string" ? v : JSON.stringify(v, null, 2))}</pre>`;
  if (f === "code") return `<pre class="data">${esc(v)}</pre>`;
  return `<p>${hl(v)}</p>`;
}
// config.rows = [[cardKey, LABEL], ...]: compact labelled facts between top and body
function rowsHtml(card) {
  const rows = (CFG.rows || []).filter(([k]) => card[k] !== undefined && card[k] !== null && card[k] !== "" && !(Array.isArray(card[k]) && !card[k].length));
  if (!rows.length) return "";
  return `<dl class="rows">${rows.map(([k, lab]) => `<dt>${esc(lab)}</dt><dd>${Array.isArray(card[k]) ? card[k].map(esc).join(" · ") : hl(String(card[k]))}</dd>`).join("")}</dl>`;
}
function goldStats() {
  let hit = 0, n = 0;
  for (const r of labelled()) { const q = byId[r.id]; if (q && q.gold !== null && q.gold !== undefined && r.label !== "unsure") { n++; hit += (r.label === q.gold) ? 1 : 0; } }
  return [hit, n];
}
let byId = {};
async function load() {
  const r = await fetch("/api/state").then(r => r.json());
  CFG = r.config; TAGS = CFG.tags || []; ROUND = CFG.round_size || 20; applyConfig();
  queue = r.queue; done = r.done; byId = Object.fromEntries(queue.map(q => [q.id, q]));
  order = queue.filter(q => !done[q.id]).map(q => q.id);
  $("#total").textContent = " / " + queue.length;
}
function applyConfig() {
  document.title = CFG.title;
  $("#introTitle").textContent = CFG.title; $("#introQ").textContent = CFG.question;
  $("#yesLab").textContent = CFG.yes.label; $("#noLab").textContent = CFG.no.label;
  $("#kYes").textContent = `${CFG.yes.label}: ${CFG.yes.hint}`; $("#kNo").textContent = `${CFG.no.label}: ${CFG.no.hint}`;
  $("#kTags").innerHTML = TAGS.length ? ` · <kbd>1-${TAGS.length}</kbd> optional reason for your last ${esc(CFG.no.label)}` : "";
  $("#kFoot").textContent = CFG.footnote;
  if (CFG.css) { let st = $("#deckCss"); if (!st) { st = document.createElement("style"); st.id = "deckCss"; document.head.appendChild(st); } st.textContent = CFG.css; }
}
let noteFor = null;
async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) toast("save failed: check the server", "miss", 2600);
}

// ---------- render ----------
function hud() {
  const n = labelled().length, xp = n * XP_CARD + goldStats()[0] * XP_GOLD;
  $("#lvl").textContent = 1 + Math.floor(xp / XP_LVL);
  $("#xp").style.width = (xp % XP_LVL) / XP_LVL * 100 + "%";
  $("#done").textContent = n;
  $("#streak").textContent = streak + (streak >= 10 ? " 🔥" : "");
  $("#flameBox").classList.toggle("hot", streak >= 10);
  const [h, g] = goldStats(); $("#gold").textContent = g ? `${h}/${g}` : "—";
  const pace = paceSec(); $("#eta").textContent = pace ? Math.ceil(order.length * pace / 60) + "m" : "—";
  const pips = $("#pips"); pips.innerHTML = "";
  for (let i = 0; i < ROUND; i++) { const s = document.createElement("span"); if (round[i]) s.className = round[i]; pips.appendChild(s); }
  return xp;
}
function paceSec() {
  const t = labelled().map(r => r.ms).filter(m => m && m < 120000).slice(-40);
  return t.length >= 3 ? t.reduce((a, b) => a + b, 0) / t.length / 1000 : 0;
}
function show() {
  const st = $("#stage"); st.innerHTML = "";
  if (!order.length) return finish();
  cur = byId[order[0]]; shownAt = Date.now();
  const F = CFG.fields, L = CFG.field_labels, ctx = cur[F.context];
  const c = document.createElement("article"); c.className = "card";
  const gold = cur.gold !== null && cur.gold !== undefined;
  c.innerHTML = `<div class="src"><span>${esc(cur[F.meta])}</span><span class="gold-tag" style="display:${gold ? "inline" : "none"}">★ GOLD CARD</span></div>
    <div class="claim"><div class="lab">${esc(L.top)}</div>${ctx ? `<div class="ctx">…follows: “${esc(ctx)}”</div>` : ""}${fmt("top", cur[F.top])}</div>
    ${cur[F.image] ? `<div class="shot"><img src="/media/${encodeURI(cur[F.image])}" alt=""></div>` : ""}
    ${cur[F.left] && cur[F.right] ? `<div class="pair">
      <figure><figcaption>← F · <b>${esc(cur[F.left_label] || "left")}</b></figcaption><div class="raw">${cur[F.left]}</div></figure>
      <figure><figcaption>J → · <b>${esc(cur[F.right_label] || "right")}</b></figcaption><div class="raw">${cur[F.right]}</div></figure></div>` : ""}
    ${rowsHtml(cur)}
    ${cur[F.body] ? `<div class="passage"><div class="lab">${esc(L.body)}</div>${fmt("body", cur[F.body])}</div>` : ""}
    <div class="stamp y">${esc(CFG.yes.label)}</div><div class="stamp n">${esc(CFG.no.label)}</div>`;
  st.appendChild(c); drag(c);
}
function whyBar() {
  const w = $("#why"); w.innerHTML = "";
  if (!lastNope || !TAGS.length) { w.classList.remove("on"); return; }
  w.classList.add("on");
  const lab = document.createElement("span"); lab.textContent = CFG.tag_prompt; w.appendChild(lab);
  TAGS.forEach((t, i) => {
    const b = document.createElement("button"); b.textContent = `${i + 1} ${t}`;
    if (done[lastNope] && done[lastNope].tag === t) b.classList.add("lit");
    b.onclick = () => tag(i); w.appendChild(b);
  });
}

// ---------- actions ----------
async function decide(label) {
  if (!cur || busy || !started) return;
  busy = true;
  const card = $(".card"), id = cur.id, ms = Date.now() - shownAt, key = label === 1 ? "y" : label === 0 ? "n" : "s";
  const btn = {y: "#bY", n: "#bN", s: "#bS"}[key]; $(btn).classList.add("press"); setTimeout(() => $(btn).classList.remove("press"), 120);
  card.classList.add("fly-" + key);
  const val = label === null ? "unsure" : label;
  done[id] = {id, label: val, ms}; history.push(id); order.shift();
  post("/api/label", {id, label: val, ms});
  const prevLvl = 1 + Math.floor((hud() - XP_CARD) / XP_LVL);
  streak = val === "unsure" ? streak : streak + 1;
  lastNope = label === 0 ? id : null;
  let r = key;
  if (cur.gold !== null && cur.gold !== undefined && val !== "unsure") {
    roundGold[1]++;
    if (val === cur.gold) { roundGold[0]++; r = "g"; sfx.gold(); toast("GOLD ✓", "gold"); confetti(50); }
    else toast(`gold card: the known answer was <b>${esc(cur.gold ? CFG.yes.label : CFG.no.label)}</b>${cur.gold_note ? "<br>" + esc(cur.gold_note) : ""}`, "miss", 2600);
  } else { sfx[key](); if (streak && streak % 10 === 0) { toast(`${streak} STREAK 🔥`, "xp"); confetti(40); } }
  round.push(r);
  const xp = hud(), lvl = 1 + Math.floor(xp / XP_LVL);
  if (lvl > prevLvl) { setTimeout(() => { sfx.lvl(); toast(`LEVEL ${lvl}`, "gold"); confetti(140); }, 250); }
  whyBar();
  setTimeout(() => { busy = false; if (round.length >= ROUND) roundBreak(); else show(); }, 240);
}
async function undo() {
  if (busy || !history.length) return;
  const id = history.pop(); delete done[id]; order.unshift(id); round.pop(); streak = Math.max(0, streak - 1); lastNope = null;
  await post("/api/undo", {id}); blip(700, 300, .12, "sine"); whyBar(); hud(); show();
}
async function tag(i) {
  if (!lastNope || !TAGS[i]) return;
  done[lastNope].tag = TAGS[i]; await post("/api/tag", {id: lastNope, tag: TAGS[i]}); blip(900, 1100, .05, "triangle", .04); whyBar();
}
function roundBreak() {
  const secs = (Date.now() - roundStart) / 1000 / round.length, pace = paceSec();
  $("#brkTitle").textContent = ["ROUND CLEAR", "NICE ROUND", "LOCKED IN", "CLEAN SWEEP"][Math.floor(Math.random() * 4)];
  $("#brkSub").textContent = `${labelled().length} done · ${order.length} to go`;
  $("#bPace").textContent = secs.toFixed(1);
  $("#bGold").textContent = roundGold[1] ? `${roundGold[0]}/${roundGold[1]}` : "—";
  $("#bLeft").textContent = pace ? Math.ceil(order.length * pace / 60) : "—";
  $("#brk").classList.add("on"); sfx.lvl(); confetti(120);
}
function nextRound() { $("#brk").classList.remove("on"); round = []; roundGold = [0, 0]; roundStart = Date.now(); hud(); show(); }
function finish() {
  const [h, g] = goldStats();
  $("#stage").innerHTML = `<div class="panel"><h2>ALL CARDS DONE</h2><div class="sub">${labelled().length} labels saved · gold ${h}/${g}</div>
    <div class="sub">${esc(CFG.done_message || "Deck complete.")}</div></div>`;
  confetti(220); sfx.lvl();
}

// ---------- swipe ----------
function drag(c) {
  let x0 = null, dx = 0;
  c.addEventListener("pointerdown", e => { if (e.target.closest(".passage") && e.pointerType === "mouse") return; x0 = e.clientX; dx = 0; c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e => {
    if (x0 === null) return; dx = e.clientX - x0;
    c.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    c.classList.toggle("tint-y", dx > 60); c.classList.toggle("tint-n", dx < -60);
    c.querySelector(".stamp.y").style.opacity = Math.min(Math.max((dx - 30) / 90, 0), 1);
    c.querySelector(".stamp.n").style.opacity = Math.min(Math.max((-dx - 30) / 90, 0), 1);
  });
  const end = () => {
    if (x0 === null) return; x0 = null;
    if (dx > 110) decide(1); else if (dx < -110) decide(0);
    else { c.style.transition = "transform .2s"; c.style.transform = ""; c.classList.remove("tint-y", "tint-n"); c.querySelectorAll(".stamp").forEach(s => s.style.opacity = 0); setTimeout(() => c.style.transition = "", 200); }
  };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
}

// ---------- wiring ----------
$("#bY").onclick = () => decide(1); $("#bN").onclick = () => decide(0); $("#bS").onclick = () => decide(null); $("#bU").onclick = undo;
$("#start").onclick = () => { $("#intro").classList.remove("on"); started = true; blip(440, 880, .15, "triangle", .06); show(); };
$("#cont").onclick = nextRound;

// ---------- notes ----------
// A note rides alongside the judgment: it never replaces a label, and it does not block the deck.
const notes = {};
function openNote() {
  if (!started || !cur || $("#brk").classList.contains("on")) return;
  noteFor = cur.id;
  $("#noteFor").textContent = `on ${cur.id} — ${String(cur[CFG.fields.meta] || "")}`;
  $("#noteText").value = notes[noteFor] || "";
  const box = $("#noteBox"), ta = $("#noteText");
  box.classList.add("on");
  void box.offsetHeight;          // force layout: focus() is a no-op on an unrendered element
  ta.focus({preventScroll: true});
  ta.setSelectionRange(ta.value.length, ta.value.length);
}
function closeNote() { $("#noteBox").classList.remove("on"); $("#noteText").blur(); }
async function saveNote() {
  const txt = $("#noteText").value.trim();
  const id = noteFor;
  closeNote();
  if (!txt) return;
  notes[id] = txt;
  await post("/api/note", {id, note: txt});
  const c = $(".card"); if (c && cur && cur.id === id) c.classList.add("noted");
  toast("note saved", "xp", 900);
  hud();
}
$("#bT").onclick = openNote; $("#noteSave").onclick = saveNote; $("#noteCancel").onclick = closeNote;
addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "TEXTAREA") {       // typing a note is not voting
    if (e.key === "Escape") { e.preventDefault(); closeNote(); }
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveNote(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if ($("#noteBox").classList.contains("on")) { if (k === "escape") closeNote(); return; }
  if (!started) { if (k === "enter" || k === " ") { e.preventDefault(); $("#start").click(); } return; }
  if ($("#brk").classList.contains("on")) { if (k === "enter" || k === " ") { e.preventDefault(); nextRound(); } return; }
  if (k === "arrowright" || k === "j") { e.preventDefault(); decide(1); }
  else if (k === "arrowleft" || k === "f") { e.preventDefault(); decide(0); }
  else if (k === "arrowdown" || k === " ") { e.preventDefault(); decide(null); }
  else if (k === "z" || k === "backspace") { e.preventDefault(); undo(); }
  else if (k >= "1" && k <= "9") tag(+k - 1);
  else if (k === "t") { e.preventDefault(); openNote(); }
  else if (k === "m") { sound = !sound; toast(sound ? "sound on" : "sound off", "xp", 600); }
});
load().then(() => { hud(); if (labelled().length) $("#start").textContent = `RESUME (${labelled().length} done) ▸`; });
</script>
</body>
</html>
